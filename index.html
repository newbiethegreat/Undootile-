<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undertale Hard Mode - Made by Newbie</title>
    <style>
        :root { 
            --ui-white: #fff; --ui-yellow: #ff0; --ui-red: #f00; 
            --ui-blue: #2eb5ff; --ui-purple: #d535ff; --ui-orange: #ffa500; 
            --ui-green: #00ff00; --ui-cyan: #00ffff;
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; color: white; user-select: none; touch-action: none; }
        #game-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 10px; box-sizing: border-box; }
        
        #enemy-sprite { width: 80px; height: 100px; position: relative; margin-bottom: 20px; transition: transform 0.2s ease-out, opacity 1s; }
        #enemy-hp-bar { width: 200px; height: 10px; background: #333; border: 2px solid white; margin-top: 10px; }
        #enemy-hp-fill { width: 100%; height: 100%; background: var(--ui-green); transition: width 0.3s; }

        #battle-area { position: relative; width: 300px; height: 200px; border: 5px solid white; background: black; overflow: hidden; transition: border-color 0.2s, transform 0.1s; display: flex; flex-direction: column; }
        #dialogue-text { padding: 15px; font-size: 16px; line-height: 1.4; flex-grow: 1; overflow-y: auto; }
        
        #soul { 
            position: absolute; width: 16px; height: 16px; 
            background: var(--ui-red); 
            clip-path: path('M8 2.1c1.1-1.1 2.9-1.1 4 0 1.1 1.1 1.1 2.9 0 4L8 10.2 4 6.1c-1.1-1.1-1.1-2.9 0-4 1.1-1.1 2.9-1.1 4 0z');
            transform: scale(1.1); z-index: 10; display: none; 
        }
        #soul.blue-mode { background: var(--ui-blue) !important; }

        .bone { position: absolute; background: white; border-radius: 2px; z-index: 5; border: 1px solid #ddd; }
        .bone.orange { background: var(--ui-orange); border-color: #ff8c00; box-shadow: 0 0 5px var(--ui-orange); }
        .bone.blue { background: var(--ui-blue); border-color: #0099ff; box-shadow: 0 0 5px var(--ui-blue); }
        
        @keyframes warn-flicker {
            0%, 100% { background: rgba(255, 255, 255, 0.05); }
            50% { background: rgba(255, 255, 255, 0.25); }
        }
        @keyframes beam-fire-h {
            0% { transform: scaleY(0.1); opacity: 1; }
            20% { transform: scaleY(1.2); opacity: 1; }
            100% { transform: scaleY(0.8); opacity: 0; }
        }
        @keyframes beam-fire-v {
            0% { transform: scaleX(0.1); opacity: 1; }
            20% { transform: scaleX(1.2); opacity: 1; }
            100% { transform: scaleX(0.8); opacity: 0; }
        }

        .blaster-warn { position: absolute; z-index: 1; animation: warn-flicker 0.1s infinite; border: 1px dashed rgba(255,255,255,0.4); }
        .blaster-beam { position: absolute; background: white; z-index: 8; box-shadow: 0 0 20px white; pointer-events: none; }
        .beam-anim-h { animation: beam-fire-h 0.45s forwards; transform-origin: center; }
        .beam-anim-v { animation: beam-fire-v 0.45s forwards; transform-origin: center; }
        
        #player-stats { width: 300px; display: flex; align-items: center; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        #hp-bar-container { width: 100px; height: 18px; background: var(--ui-red); margin: 0 10px; }
        #hp-bar-fill { width: 100%; height: 100%; background: var(--ui-yellow); transition: width 0.2s; }

        #menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 310px; }
        .menu-btn { border: 2px solid var(--ui-orange); color: var(--ui-orange); background: black; padding: 12px; font-size: 18px; font-weight: bold; text-align: center; cursor: pointer; text-transform: uppercase; }
        .menu-btn:active { background: #331a08; color: white; border-color: white; }

        .item-list { display: none; padding: 10px; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; box-sizing: border-box; }
        .item-option { color: white; cursor: pointer; padding: 8px; font-size: 14px; }
        .item-option::before { content: "* "; }

        #attack-game { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        #attack-bar-bg { width: 90%; height: 40px; border: 3px solid white; position: relative; }
        #attack-cursor { position: absolute; width: 8px; height: 100%; background: cyan; left: 0; box-shadow: 0 0 10px cyan; pointer-events: none; }
        #center-line { position: absolute; width: 4px; height: 100%; background: white; left: 50%; transform: translateX(-50%); pointer-events: none; }

        .full-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .restart-btn { margin-top: 20px; padding: 12px 24px; border: 2px solid white; background: black; color: white; font-family: inherit; font-size: 18px; cursor: pointer; text-transform: uppercase; pointer-events: auto; }
        .restart-btn:hover { background: #333; }
        .restart-btn:active { background: white; color: black; }

        #main-menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; overflow-y: auto; padding: 20px; }
        
        .char-grid { display: flex; flex-wrap: wrap; justify-content: center; max-width: 600px; gap: 10px; margin-bottom: 20px; }
        .diff-btn { background: black; border: 2px solid; padding: 12px 20px; font-size: 16px; font-family: inherit; cursor: pointer; text-transform: uppercase; width: 260px; font-weight: bold; transition: all 0.1s; }
        .diff-btn.easy { border-color: var(--ui-green); color: var(--ui-green); }
        .diff-btn.easy:active { background: var(--ui-green); color: black; }
        .diff-btn.normal { border-color: var(--ui-yellow); color: var(--ui-yellow); }
        .diff-btn.normal:active { background: var(--ui-yellow); color: black; }
        .diff-btn.hard { border-color: var(--ui-red); color: var(--ui-red); }
        .diff-btn.hard:active { background: var(--ui-red); color: black; }

        #controls { position: fixed; bottom: 15px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 20; }
        .touch-zone { width: 110px; height: 110px; background: rgba(255,255,255,0.05); border-radius: 50%; pointer-events: auto; position: relative; border: 1px solid rgba(255,255,255,0.15); }
        #joystick-knob { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; top: 35px; left: 35px; }
        #jump-btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; color: white; }

        #flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; pointer-events: none; opacity: 0; z-index: 100; transition: opacity 0.05s; }

        .SKELETON.phase-2 #right-eye { fill: var(--ui-blue); filter: drop-shadow(0 0 5px var(--ui-blue)); }
        .SKELETON.phase-3 #right-eye { fill: var(--ui-red); filter: drop-shadow(0 0 8px var(--ui-red)); }
        .SKELETON.phase-3 #battle-area { border-color: var(--ui-red); }
        .SKELETON.phase-4 #right-eye { fill: var(--ui-purple); filter: drop-shadow(0 0 10px var(--ui-purple)); animation: warn-flicker 0.2s infinite; }
        .SKELETON.phase-4 #battle-area { border-color: var(--ui-purple); animation: warn-flicker 0.4s infinite; }
        .SKELETON.phase-4 #enemy-sprite { animation: float-shake 0.2s infinite; }
        
        .KNIGHT.phase-2 #knight-eye { fill: var(--ui-orange); filter: drop-shadow(0 0 8px var(--ui-orange)); }
        .KNIGHT.phase-3 #knight-eye { fill: var(--ui-red); filter: drop-shadow(0 0 12px var(--ui-red)); animation: warn-flicker 0.2s infinite;}
        .KNIGHT.phase-3 #battle-area { border-color: var(--ui-red); animation: warn-flicker 0.3s infinite; }

        @keyframes float-shake { 0% {transform: translate(2px, 1px)} 50% {transform: translate(-2px, -1px)} 100% {transform: translate(2px, 1px)} }

        .top-btn { position: absolute; top: 15px; background: black; color: white; border: 2px solid white; padding: 8px 12px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; z-index: 50; display: none; }
        #back-to-menu-btn { left: 15px; }
        #mute-btn { right: 15px; border-color: var(--ui-cyan); color: var(--ui-cyan); }
        .top-btn:active { background: white; color: black; }

        #skip-btn { position: absolute; bottom: 10px; right: 10px; z-index: 60; border-color: var(--ui-yellow); color: var(--ui-yellow); display: none; }

        #credits-text { margin-top: 15px; color: #888; font-size: 14px; font-style: italic; letter-spacing: 1px; }

        .active-choice { background: white !important; color: black !important; border-color: white !important; }
        #pc-hint { position: fixed; bottom: 5px; left: 5px; color: rgba(255,255,255,0.5); font-size: 12px; z-index: 50; display: none; font-weight: bold; }
        @media (hover: hover) and (pointer: fine) { #pc-hint { display: block; } }
    </style>
</head>
<body>

<div id="main-menu-overlay">
    <div style="color: white; font-size: 32px; font-weight: bold; margin-bottom: 20px; text-align: center; letter-spacing: 2px;">CHOOSE YOUR<br>OPPONENT</div>
    <div class="char-grid">
        <button class="diff-btn easy" onclick="startGame('DUMMY')">THE DUMMY (EASY)</button>
        <button class="diff-btn easy" onclick="startGame('SPIDER')">THE SPIDER (EASY)</button>
        <button class="diff-btn normal" onclick="startGame('SKELETON')">THE SKELETON (NORMAL)</button>
        <button class="diff-btn normal" onclick="startGame('ROBOT')">THE ROBOT (NORMAL)</button>
        <button class="diff-btn hard" onclick="startGame('KNIGHT')">THE KNIGHT (HARD)</button>
        <button class="diff-btn hard" onclick="startGame('FLOWER')">THE FLOWER (HARD)</button>
    </div>
    <div id="credits-text">Made by Newbie</div>
</div>

<button id="back-to-menu-btn" class="top-btn" onclick="resetGame()">&lt; BACK</button>
<button id="mute-btn" class="top-btn" onclick="toggleMute()">🎵 MUTE</button>
<button id="skip-btn" class="top-btn" onclick="skipRules()">SKIP &gt;&gt;</button>

<div id="game-screen">
    <div id="enemy-container">
        <div id="enemy-sprite"></div>
        <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
    </div>

    <div id="battle-area">
        <div id="dialogue-text">* The final battle begins.</div>
        <div id="item-menu" class="item-list"></div>
        <div id="act-menu" class="item-list"></div>

        <div id="attack-game">
            <div style="margin-bottom: 10px; color: cyan;">TAP TO ATTACK!</div>
            <div id="attack-bar-bg">
                <div id="center-line"></div>
                <div id="attack-cursor"></div>
            </div>
        </div>

        <div id="game-over-overlay" class="full-overlay">
            <div style="color: var(--ui-red); font-size: 24px; font-weight: bold;">GAME OVER</div>
            <button class="restart-btn" onclick="resetGame()">MAIN MENU</button>
        </div>

        <div id="victory-overlay" class="full-overlay">
            <div style="color: var(--ui-yellow); font-size: 24px; font-weight: bold;">VICTORY</div>
            <div style="font-size: 14px; margin-top: 10px;">YOU WON!</div>
            <button class="restart-btn" onclick="resetGame()">MAIN MENU</button>
        </div>

        <div id="soul"></div>
    </div>

    <div id="player-stats">
        <span>LV 19</span><div id="hp-bar-container"><div id="hp-bar-fill"></div></div><span id="hp-text">92/92</span>
    </div>

    <div id="menu-grid">
        <div id="btn-fight" class="menu-btn" onclick="handleMenu('FIGHT')">FIGHT</div>
        <div id="btn-act" class="menu-btn" onclick="handleMenu('ACT')">ACT</div>
        <div id="btn-item" class="menu-btn" onclick="handleMenu('ITEM')">ITEM</div>
        <div id="btn-mercy" class="menu-btn" onclick="handleMenu('MERCY')">MERCY</div>
    </div>
</div>

<div id="controls" style="display: none;">
    <div id="joystick" class="touch-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn" class="touch-zone" style="visibility: hidden; display: flex;">JUMP</div>
</div>

<div id="pc-hint">ARROWS/WASD: Move | Z/ENTER: Select | X/SHIFT: Back</div>

<div id="flash"></div>

<script>
    let state = 'MAIN_MENU';
    let currentCharacter = 'SKELETON';
    let hp = 92;
    let maxHp = 92;
    let enemyHp = 300;
    let maxEnemyHp = 300;
    let dmgMult = 1;
    let isBlueSoul = false;
    let soulPos = { x: 142, y: 140 };
    let velocity = { x: 0, y: 0 };
    let inputDir = { x: 0, y: 0 };
    let lastInputDir = { x: 0, y: 0 };
    
    let isJumping = false;
    let turnCount = 0;
    let lastPattern = null;
    let forceRepeat = false; 
    let itemUsedThisRound = false; 
    let projectiles = [];
    let invul = 0;
    let gameOver = false;
    let gameWon = false;
    let currentPhase = 1;
    let rulesTimer;

    let attackCursorX = 0;
    const keys = {};
    let menuSelection = 0;
    let submenuSelection = 0;
    const menuOrder = ['FIGHT', 'ACT', 'ITEM', 'MERCY'];
    const menuIds = ['btn-fight', 'btn-act', 'btn-item', 'btn-mercy'];

    const inventory = [];

    const soul = document.getElementById('soul');
    const battleArea = document.getElementById('battle-area');
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    const jumpBtn = document.getElementById('jump-btn');
    const controls = document.getElementById('controls');
    const itemMenu = document.getElementById('item-menu');
    const actMenu = document.getElementById('act-menu');
    const diagText = document.getElementById('dialogue-text');
    const attackGame = document.getElementById('attack-game');
    const attackCursor = document.getElementById('attack-cursor');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const victoryOverlay = document.getElementById('victory-overlay');
    const enemyHpFill = document.getElementById('enemy-hp-fill');
    const enemySprite = document.getElementById('enemy-sprite');
    const mainMenuOverlay = document.getElementById('main-menu-overlay');
    const backToMenuBtn = document.getElementById('back-to-menu-btn');
    const muteBtn = document.getElementById('mute-btn');
    const skipBtn = document.getElementById('skip-btn');

    // --- KEYBOARD CONTROLS ---
    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        keys[k] = true;
        keys[e.key] = true;
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
        
        if (state === 'MENU') {
            if (k === 'arrowright' || k === 'd') { menuSelection = (menuSelection + 1) % 4; updateMenuVisuals(); playSoundEffect('select'); }
            if (k === 'arrowleft' || k === 'a') { menuSelection = (menuSelection + 3) % 4; updateMenuVisuals(); playSoundEffect('select'); }
            if (k === 'enter' || k === 'z') { handleMenu(menuOrder[menuSelection]); }
        } else if (state === 'SUBMENU') {
            const list = (itemMenu.style.display === 'grid') ? itemMenu : actMenu;
            const options = list.querySelectorAll('.item-option');
            if (k === 'arrowdown' || k === 's') { submenuSelection = (submenuSelection + 1) % options.length; updateSubmenuVisuals(); playSoundEffect('select'); }
            if (k === 'arrowup' || k === 'w') { submenuSelection = (submenuSelection + options.length - 1) % options.length; updateSubmenuVisuals(); playSoundEffect('select'); }
            if (k === 'enter' || k === 'z') { options[submenuSelection].click(); }
            if (k === 'x' || e.key === 'Shift') { cancelSubMenu(); }
        } else if (state === 'ATTACKING') {
            if (k === 'enter' || k === 'z') { confirmAttack(); }
        } else if (state === 'EXPLAINING') {
            if (k === 'enter' || k === 'z' || k === 'escape') { skipRules(); }
        }
    });

    window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
        keys[e.key] = false;
    });

    function updateMenuVisuals() {
        if (state !== 'MENU') {
            menuIds.forEach(id => document.getElementById(id).classList.remove('active-choice'));
            return;
        }
        menuIds.forEach((id, i) => {
            const el = document.getElementById(id);
            if (i === menuSelection) el.classList.add('active-choice');
            else el.classList.remove('active-choice');
        });
    }

    function updateSubmenuVisuals() {
        const list = (itemMenu.style.display === 'grid') ? itemMenu : actMenu;
        const options = list.querySelectorAll('.item-option');
        options.forEach((opt, i) => {
            if (i === submenuSelection) opt.classList.add('active-choice');
            else opt.classList.remove('active-choice');
        });
    }

    let audioCtx;
    let isMuted = false;
    let musicTimer;
    
    const NOTES = {
        'C2': 65.41, 'D2': 73.42, 'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'B2': 123.47,
        'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
        'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
        'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00
    };

    const MUSIC_THEMES = {
        'DUMMY': { 
            tempo: 125, type: 'square', bassType: 'triangle',
            seq: ['A3',null,'C4',null, 'D4',null,'D#4','E4', null,'C4',null,'A3', null,'G3',null,'A3',
                  'A3',null,'C4',null, 'D4',null,'D#4','E4', null,'G4',null,'E4', null,'D4',null,'C4',
                  'E4',null,'D#4',null, 'D4',null,'C4',null, 'A3',null,'G3',null, 'A3',null,null,null],
            bass: ['A2',null,'E3',null, 'A2',null,'E3',null, 'A2',null,'E3',null, 'A2',null,'E3',null,
                   'A2',null,'E3',null, 'A2',null,'E3',null, 'A2',null,'E3',null, 'A2',null,'E3',null,
                   'E3',null,'D#3',null, 'D3',null,'C3',null, 'A2',null,'E2',null, 'A2',null,null,null]
        },
        'SPIDER': { 
            tempo: 100, type: 'triangle', bassType: 'square',
            seq: ['E4','G4','B4','E5','E4','G4','B4','E5'],
            bass: ['E3',null,'E3',null, 'E3',null,'E3',null]
        },
        'SKELETON': { 
            tempo: 110, type: 'square', bassType: 'square',
            seq: ['D4','D4','D5',null,'A4',null,null,'G#4',null,'G4',null,'F4',null,'D4','F4','G4',
                  'C4','C4','D5',null,'A4',null,null,'G#4',null,'G4',null,'F4',null,'D4','F4','G4',
                  'B3','B3','D5',null,'A4',null,null,'G#4',null,'G4',null,'F4',null,'D4','F4','G4',
                  'A#3','A#3','D5',null,'A4',null,null,'G#4',null,'G4',null,'F4',null,'D4','F4','G4'],
            bass: ['D3',null,null,null, null,null,null,null, null,null,null,null, null,null,null,null,
                   'C3',null,null,null, null,null,null,null, null,null,null,null, null,null,null,null,
                   'B2',null,null,null, null,null,null,null, null,null,null,null, null,null,null,null,
                   'A#2',null,null,null, null,null,null,null, null,null,null,null, null,null,null,null]
        },
        'ROBOT': { 
            tempo: 110, type: 'square', bassType: 'square',
            seq: ['C4','E4','G4','C5','G4','E4'],
            bass: ['C3','C3','C3','C3','C3','C3']
        },
        'KNIGHT': { 
            tempo: 105, type: 'sawtooth', bassType: 'square',
            seq: ['A4',null,'E5',null,'D5',null,'C5',null, 'B4','C5','B4','G4', 'A4',null,null,null,
                  'A4',null,'E5',null,'D5',null,'C5',null, 'B4','C5','D5','E5', 'A5',null,null,null,
                  'F4',null,'C5',null,'B4',null,'A4',null, 'G4','A4','G4','E4', 'F4',null,null,null],
            bass: ['A2',null,null,null, null,null,null,null, 'G2',null,null,null, null,null,null,null, 
                   'F2',null,null,null, null,null,null,null, 'G2',null,null,null, null,null,null,null,
                   'F2',null,null,null, null,null,null,null, 'C3',null,null,null, 'E3',null,null,null]
        },
        'FLOWER': { 
            tempo: 90, type: 'sawtooth', bassType: 'sawtooth',
            seq: ['A4','A#4','A4','F4','D4','F4'],
            bass: ['D2',null,'D2',null,'D2',null]
        }
    };

    function toggleMute() {
        isMuted = !isMuted;
        muteBtn.innerText = isMuted ? "🎵 UNMUTE" : "🎵 MUTE";
        muteBtn.style.color = isMuted ? "gray" : "var(--ui-cyan)";
        muteBtn.style.borderColor = isMuted ? "gray" : "var(--ui-cyan)";
        if (isMuted && audioCtx) { audioCtx.suspend(); } 
        else if (!isMuted && audioCtx) { audioCtx.resume(); }
    }

    function playMusic(character) {
        if (musicTimer) clearTimeout(musicTimer);
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (isMuted) audioCtx.suspend(); else audioCtx.resume();

        const theme = MUSIC_THEMES[character];
        let seqIndex = 0;

        const playSynth = (freq, type, duration, vol) => {
            if (!freq) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration + 0.1);
        };

        const playNextNote = () => {
            if (gameOver || gameWon || state === 'MAIN_MENU') return;
            let speedMod = (currentPhase - 1) * 0.12; 
            if (currentPhase === 4) speedMod = 0.40;  
            let currentTempo = theme.tempo * (1 - speedMod);
            if (!isMuted) {
                const note = theme.seq[seqIndex % theme.seq.length];
                const bassNote = theme.bass[seqIndex % theme.bass.length];
                let volMod = 1 + (currentPhase - 1) * 0.15;
                let mType = theme.type;
                if (currentPhase >= 3 && mType === 'triangle') mType = 'square';
                if (currentPhase === 4) mType = 'sawtooth';
                if (note) playSynth(NOTES[note], mType, (currentTempo / 1000) * 1.5, 0.05 * volMod);
                if (bassNote) playSynth(NOTES[bassNote], theme.bassType, (currentTempo / 1000) * 3.5, 0.08 * volMod);
            }
            seqIndex++;
            musicTimer = setTimeout(playNextNote, currentTempo);
        };
        playNextNote();
    }

    function playSoundEffect(type) {
        if (isMuted || !audioCtx || gameOver || gameWon) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'select') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'hurt') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'attack') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
            gainNode.gain.setValueAtTime(0.08, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'heal') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'jump') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        }
    }

        battleArea.appendChild(el);

    function spawnBlaster(orient, pos) {
        if (gameOver || gameWon) return;
        const warn = document.createElement('div');
        warn.className = 'blaster-warn';
        const thickness = 25;
        if (orient === 'h') { 
            warn.style.width = '300px'; warn.style.height = thickness + 'px'; 
            warn.style.left = '0'; warn.style.top = (pos - thickness/2) + 'px'; 
        } else { 
            warn.style.width = thickness + 'px'; warn.style.height = '200px'; 
            warn.style.left = (pos - thickness/2) + 'px'; warn.style.top = '0'; 
        }
        battleArea.appendChild(warn);

        setTimeout(() => {
            if (gameOver || gameWon) { warn.remove(); return; }
            warn.remove();
            const beam = document.createElement('div');
            beam.className = 'blaster-beam ' + (orient === 'h' ? 'beam-anim-h' : 'beam-anim-v');
            const beamThickness = 45;
            if (orient === 'h') { 
                beam.style.width = '300px'; beam.style.height = beamThickness + 'px'; 
                beam.style.left = '0'; beam.style.top = (pos - beamThickness/2) + 'px'; 
            } else { 
                beam.style.width = beamThickness + 'px'; beam.style.height = '200px'; 
                beam.style.left = (pos - beamThickness/2) + 'px'; beam.style.top = '0'; 
            }
            battleArea.appendChild(beam);
            const p = { el: beam, x: parseInt(beam.style.left), y: parseInt(beam.style.top), vx: 0, vy: 0, w: parseInt(beam.style.width), h: parseInt(beam.style.height), type: 'beam', startTime: Date.now() };
            projectiles.push(p);
            setTimeout(() => { 
                beam.remove(); projectiles = projectiles.filter(item => item !== p); 
            }, 450);
        }, 650);
    }

    function confirmAttack() {
        if (state !== 'ATTACKING') return;
        playSoundEffect('attack');
        state = 'WAITING';
        attackGame.style.display = 'none';
        attackGame.onclick = null;
        const accuracy = 1 - (Math.abs(attackCursorX - 50) / 50); 
        if (itemUsedThisRound) {
            diagText.style.display = 'block';
            diagText.innerHTML = "* You swing your weapon...<br>* But the enemy anticipated it and dodged!";
            enemySprite.style.transform = 'translateX(-40px)';
            setTimeout(() => { enemySprite.style.transform = 'translateX(0)'; }, 300);
            itemUsedThisRound = false; 
            setTimeout(startDodge, 1500);
            return;
        }
        const damage = Math.floor(40 * accuracy) + 15; 
        enemyHp -= damage;
        let phaseChanged = false;
        let fakeDeath = false;
        
        // Phase logic handles health thresholds per character
        if (currentCharacter === 'SKELETON') {
            if (enemyHp <= 0 && currentPhase < 4) {
                enemyHp = 150; currentPhase = 4; turnCount = 0; fakeDeath = true;
                document.getElementById('game-screen').className = 'SKELETON phase-4';
            } else if (enemyHp <= 200 && enemyHp > 100 && currentPhase === 1) {
                currentPhase = 2; turnCount = 0; phaseChanged = true;
                document.getElementById('game-screen').className = 'SKELETON phase-2';
            } else if (enemyHp <= 100 && enemyHp > 0 && currentPhase === 2) {
                currentPhase = 3; turnCount = 0; phaseChanged = true;
                document.getElementById('game-screen').className = 'SKELETON phase-3';
            }
        } else if (currentCharacter === 'DUMMY') {
            if (enemyHp <= 120 && enemyHp > 60 && currentPhase === 1) { currentPhase = 2; turnCount = 0; phaseChanged = true; }
            else if (enemyHp <= 60 && enemyHp > 0 && currentPhase === 2) { currentPhase = 3; turnCount = 0; phaseChanged = true; }
        } else if (currentCharacter === 'SPIDER') {
            if (enemyHp <= 150 && enemyHp > 75 && currentPhase === 1) { currentPhase = 2; turnCount = 0; phaseChanged = true; }
            else if (enemyHp <= 75 && enemyHp > 0 && currentPhase === 2) { currentPhase = 3; turnCount = 0; phaseChanged = true; }
        } else if (currentCharacter === 'ROBOT') {
            if (enemyHp <= 250 && enemyHp > 125 && currentPhase === 1) { currentPhase = 2; turnCount = 0; phaseChanged = true; }
            else if (enemyHp <= 125 && enemyHp > 0 && currentPhase === 2) { currentPhase = 3; turnCount = 0; phaseChanged = true; }
        } else if (currentCharacter === 'KNIGHT') {
            if (enemyHp <= 300 && enemyHp > 150 && currentPhase === 1) {
                currentPhase = 2; turnCount = 0; phaseChanged = true;
                document.getElementById('game-screen').className = 'KNIGHT phase-2';
            } else if (enemyHp <= 150 && enemyHp > 0 && currentPhase === 2) {
                currentPhase = 3; turnCount = 0; phaseChanged = true;
                document.getElementById('game-screen').className = 'KNIGHT phase-3';
            }
        } else if (currentCharacter === 'FLOWER') {
            if (enemyHp <= 400 && enemyHp > 200 && currentPhase === 1) { currentPhase = 2; turnCount = 0; phaseChanged = true; }
            else if (enemyHp <= 200 && enemyHp > 0 && currentPhase === 2) { currentPhase = 3; turnCount = 0; phaseChanged = true; }
        }
        
        enemyHpFill.style.width = Math.max(0, (enemyHp/maxEnemyHp)*100) + '%';
        document.getElementById('flash').style.opacity = 1;
        setTimeout(() => document.getElementById('flash').style.opacity = 0, 50);
        
        if (enemyHp <= 0 && (currentPhase === 4 || currentCharacter !== 'SKELETON')) {
            triggerVictory();
        } else {
            diagText.style.display = 'block';
            if (fakeDeath) {
                diagText.innerHTML = `* You dealt ${damage} damage!<br><span style="color:var(--ui-red)">* ... But it refused to yield.</span>`;
            } else if (phaseChanged) {
                diagText.innerHTML = `* You dealt ${damage} damage!<br>* The enemy changes tactics!`;
            } else {
                diagText.innerHTML = `* You dealt ${damage} damage!`;
            }
            setTimeout(startDodge, 1500); 
        }
    }

    function startAttackMiniGame() {
        state = 'ATTACKING';
        diagText.style.display = 'none';
        itemMenu.style.display = 'none';
        actMenu.style.display = 'none';

        controls.style.display = 'none';
        updateMenuVisuals();
        
        attackCursorX = 0;
        let speed = 6;
        let direction = 1;
        
        const animateAttack = () => {
            if (state !== 'ATTACKING') return;
            attackCursorX += speed * direction;
            if (attackCursorX > 96 || attackCursorX < 0) direction *= -1;
            attackCursor.style.left = attackCursorX + '%';
            requestAnimationFrame(animateAttack);
        };
        animateAttack();
        
        attackGame.onclick = (e) => {
            e.stopPropagation();
            confirmAttack();
        };
    }

    function renderInventory() {
        itemMenu.innerHTML = '';
        if(inventory.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.style.color = 'white'; emptyDiv.style.padding = '8px';
            emptyDiv.innerText = '(Empty)'; itemMenu.appendChild(emptyDiv);
        } else {
            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-option'; div.innerText = item.name;
                div.onclick = () => useItem(index); itemMenu.appendChild(div);
            });
        }
        const backBtn = document.createElement('div');
        backBtn.className = 'item-option'; backBtn.style.color = '#aaa';
        backBtn.innerText = 'Back'; backBtn.onclick = cancelSubMenu;
        itemMenu.appendChild(backBtn);
    }

    function useItem(index) {
        if (state !== 'SUBMENU') return;
        state = 'WAITING';
        playSoundEffect('heal');
        const itemName = inventory[index].name;
        hp = maxHp; 
        updateHPDisplay();
        inventory.splice(index, 1);
        itemMenu.style.display = 'none';
        diagText.style.display = 'block';
        forceRepeat = true;
        itemUsedThisRound = true;
        diagText.innerHTML = `* You used the ${itemName}. HP fully restored!`;
        setTimeout(() => { startAttackMiniGame(); }, 1500);
    }

    function renderActMenu() {
        actMenu.innerHTML = '';
        const acts = ['Check', 'Back'];
        acts.forEach(act => {
            const div = document.createElement('div'); div.className = 'item-option'; div.innerText = act;
            div.onclick = () => { if(act === 'Back') cancelSubMenu(); else { diagText.style.display = 'block'; diagText.innerHTML = "* The opponent stares blankly."; actMenu.style.display = 'none'; state = 'MENU'; } };
            actMenu.appendChild(div);
        });
    }
    
    function cancelSubMenu() {
        if (state !== 'SUBMENU') return;
        playSoundEffect('select');
        itemMenu.style.display = 'none'; actMenu.style.display = 'none';
        diagText.style.display = 'block'; state = 'MENU'; updateMenuVisuals();
    }

    function startDodge() {
        if (gameOver || gameWon) return;
        state = 'DODGING';
        diagText.style.display = 'none';
        soul.style.display = 'block';
        controls.style.display = 'flex';
        soulPos = { x: 142, y: isBlueSoul ? 179 : 100 };
        velocity = { x: 0, y: 0 };
        let t = 0;
        let nextPattern;
        if (forceRepeat && lastPattern) {
            nextPattern = lastPattern; forceRepeat = false; 
        } else {
            let allowedPatterns = allPatterns[currentCharacter].filter(p => currentPhase >= p.minPhase && currentPhase <= p.maxPhase);
            nextPattern = allowedPatterns[Math.floor(Math.random() * allowedPatterns.length)];
        }
        lastPattern = nextPattern;
        const currentPatternFn = nextPattern.fn;
        turnCount++;

        const loop = () => {
            if (state !== 'DODGING' && state !== 'GAMEOVER') return;
            
            t++;
            
            if (state === 'DODGING') {
                let kx = 0; let ky = 0;
                if (keys['arrowleft'] || keys['a']) kx = -1;
                if (keys['arrowright'] || keys['d']) kx = 1;
                if (keys['arrowup'] || keys['w']) ky = -1;
                if (keys['arrowdown'] || keys['s']) ky = 1;
                
                let moveX = inputDir.x !== 0 ? inputDir.x : (kx * 0.85); 
                let moveY = inputDir.y !== 0 ? inputDir.y : (ky * 0.85);

                if (isBlueSoul && (keys['arrowup'] || keys['w'] || keys[' ']) && velocity.y === 0) {
                    velocity.y = -7.2; playSoundEffect('jump'); keys[' '] = false;
                }

                if (isBlueSoul) {
                    velocity.y += 0.45;
                    if ((isJumping || keys['arrowup'] || keys['w'] || keys[' ']) && velocity.y < 0) velocity.y -= 0.18;
                    soulPos.x += moveX * 4.2;
                    soulPos.y += velocity.y;
                    if (soulPos.y > 179) { soulPos.y = 179; velocity.y = 0; }
                } else {
                    soulPos.x += moveX * 5;
                    soulPos.y += moveY * 5;
                }
                soulPos.x = Math.max(2, Math.min(282, soulPos.x));
                soulPos.y = Math.max(2, Math.min(182, soulPos.y));
                soul.style.left = soulPos.x + 'px';
                soul.style.top = soulPos.y + 'px';
            }

            currentPatternFn(t, currentPhase); 
            checkCollisions();

            if (invul > 0) { 
                invul--; 
                soul.style.opacity = t % 4 < 2 ? 0.3 : 1; 
            } else soul.style.opacity = 1;

            if (t < 400) {
                requestAnimationFrame(loop);
            } else {
                if (state !== 'GAMEOVER') endTurn();
            }
        };
        loop();
    }

    function checkCollisions() {
        if (state === 'MENU' || state === 'VICTORY' || state === 'EXPLAINING' || invul > 0) {
            updateProjectilePositions();
            return;
        }
        
        const sx = soulPos.x + 8;
        const sy = soulPos.y + 8; 
        const isMoving = Math.abs(inputDir.x) > 0.1 || Math.abs(inputDir.y) > 0.1 || Math.abs(velocity.y) > 0.2 || keys['arrowleft'] || keys['a'] || keys['arrowright'] || keys['d'] || (!isBlueSoul && (keys['arrowup'] || keys['w'] || keys['arrowdown'] || keys['s']));

        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            if (!p.type.includes('beam')) {
                p.x += p.vx; p.y += p.vy;
                p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px'; 
            }

            const padding = 3; 
            const hit = (sx > p.x + padding && sx < p.x + p.w - padding && sy > p.y + padding && sy < p.y + p.h - padding);

            if (hit && state === 'DODGING') {
                let takesDmg = true;
                if (p.type.includes('blue') && !isMoving) takesDmg = false;
                if (p.type.includes('orange') && isMoving) takesDmg = false;

                if (takesDmg) {
                    playSoundEffect('hurt');
                    const baseDamage = p.type.includes('beam') ? 5 : 3;
                    hp = Math.max(0, hp - Math.ceil(baseDamage * dmgMult));
                    invul = 25; 
                    updateHPDisplay();
                    
                    if (hp <= 0) { 
                        triggerGameOver(); 
                    }
                }
            }

            if (!p.type.includes('beam') && (p.x < -100 || p.x > 400)) { p.el.remove(); projectiles.splice(i, 1); }
        }
    }

    function updateProjectilePositions() {
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            if (!p.type.includes('beam')) {
                p.x += p.vx; p.y += p.vy;
                p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px'; 
            }
            if (!p.type.includes('beam') && (p.x < -100 || p.x > 400)) { p.el.remove(); projectiles.splice(i, 1); }
        }
    }

    function triggerGameOver() {
        gameOver = true;
        state = 'GAMEOVER';
        document.getElementById('game-over-overlay').style.display = 'flex';
        controls.style.display = 'none';
    }

    function triggerVictory() {
        gameWon = true; state = 'VICTORY';
        enemySprite.style.opacity = '0';
        setTimeout(() => {
            document.getElementById('victory-overlay').style.display = 'flex';
            controls.style.display = 'none';
            soul.style.display = 'none';
        }, 1200);
    }

    function resetGame() {
        if (musicTimer) clearTimeout(musicTimer);
        if (rulesTimer) clearTimeout(rulesTimer);
        turnCount = 0; lastPattern = null; forceRepeat = false; itemUsedThisRound = false;
        gameOver = false; gameWon = false; invul = 0; state = 'MAIN_MENU'; currentPhase = 1;
        document.getElementById('game-screen').className = '';
        mainMenuOverlay.style.display = 'flex'; backToMenuBtn.style.display = 'none'; muteBtn.style.display = 'none'; skipBtn.style.display = 'none';
        initInventory(); updateHPDisplay(); enemyHpFill.style.width = '100%'; enemySprite.style.opacity = '1';
        document.getElementById('game-over-overlay').style.display = 'none'; document.getElementById('victory-overlay').style.display = 'none';
        itemMenu.style.display = 'none'; actMenu.style.display = 'none'; attackGame.style.display = 'none';
        diagText.style.display = 'block'; diagText.innerHTML = "* The battle begins anew.";
        controls.style.display = 'none'; soul.style.display = 'none'; soul.style.opacity = '1';
        soul.style.transform = 'scale(1.1)';
        setSoulMode(false); projectiles.forEach(p => p.el.remove()); projectiles = [];
        document.querySelectorAll('.bone, .blaster-warn, .blaster-beam').forEach(el => el.remove());
    }

    function setSoulMode(blue) {
        isBlueSoul = blue;
        if (blue) { soul.classList.add('blue-mode'); jumpBtn.style.visibility = 'visible'; }
        else { soul.classList.remove('blue-mode'); jumpBtn.style.visibility = 'hidden'; }
    }

    function updateHPDisplay() {
        document.getElementById('hp-bar-fill').style.width = (hp/maxHp)*100 + '%';
        document.getElementById('hp-text').innerText = hp + "/" + maxHp;
    }

    function endTurn() {
        if (gameOver || gameWon) return;
        state = 'MENU';
        soul.style.display = 'none';
        controls.style.display = 'none';
        diagText.style.display = 'block';
        diagText.innerHTML = "* The enemy waits for your next move.";
        projectiles.forEach(p => p.el.remove());
        projectiles = [];
        updateMenuVisuals();
    }

    const handleInput = (e) => {
        if (gameOver || gameWon || state === 'EXPLAINING') return;
        e.preventDefault();
        const touch = e.touches[0];
        const r = joystick.getBoundingClientRect();
        const dx = touch.clientX - (r.left + r.width/2);
        const dy = touch.clientY - (r.top + r.height/2);
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
        const angle = Math.atan2(dy, dx);
        inputDir = { x: Math.cos(angle) * (dist/40), y: Math.sin(angle) * (dist/40) };
        knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
    };
    joystick.addEventListener('touchstart', handleInput);
    joystick.addEventListener('touchmove', handleInput);
    joystick.addEventListener('touchend', () => { inputDir = {x:0, y:0}; knob.style.transform = 'none'; });
    
    jumpBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state === 'EXPLAINING') return;
        isJumping = true;
        if (isBlueSoul && Math.abs(velocity.y) < 0.1) {
            velocity.y = -7.2; playSoundEffect('jump');
        }
    });
    jumpBtn.addEventListener('touchend', () => isJumping = false);
</script>
</body>
</html>
