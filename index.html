<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undertale Hard Mode - Advanced</title>
    <style>
        :root { 
            --ui-white: #fff; --ui-yellow: #ff0; --ui-red: #f00; 
            --ui-blue: #2eb5ff; --ui-purple: #d535ff; --ui-orange: #ffa500; 
            --ui-green: #00ff00; --ui-cyan: #00ffff;
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; color: white; user-select: none; touch-action: none; }
        #game-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 10px; box-sizing: border-box; }
        
        #enemy-sprite { width: 80px; height: 100px; position: relative; margin-bottom: 20px; transition: transform 0.2s ease-out, opacity 1s; }
        #enemy-hp-bar { width: 200px; height: 10px; background: #333; border: 2px solid white; margin-top: 10px; }
        #enemy-hp-fill { width: 100%; height: 100%; background: var(--ui-green); transition: width 0.3s; }

        #battle-area { position: relative; width: 300px; height: 200px; border: 5px solid white; background: black; overflow: hidden; transition: all 0.4s ease-in-out; display: flex; flex-direction: column; }
        #battle-area.shrunk { width: 180px; height: 180px; }
        
        #dialogue-text { padding: 15px; font-size: 16px; line-height: 1.4; flex-grow: 1; overflow-y: auto; }
        
        #soul { 
            position: absolute; width: 16px; height: 16px; 
            background: var(--ui-red); 
            clip-path: path('M8 2.1c1.1-1.1 2.9-1.1 4 0 1.1 1.1 1.1 2.9 0 4L8 10.2 4 6.1c-1.1-1.1-1.1-2.9 0-4 1.1-1.1 2.9-1.1 4 0z');
            transform: scale(1.1); z-index: 10; display: none; 
        }
        #soul.blue-mode { background: var(--ui-blue) !important; }

        .bone { position: absolute; background: white; border-radius: 2px; z-index: 5; border: 1px solid #ddd; }
        .bone.orange { background: var(--ui-orange); border-color: #ff8c00; box-shadow: 0 0 5px var(--ui-orange); }
        .bone.blue { background: var(--ui-blue); border-color: #0099ff; box-shadow: 0 0 5px var(--ui-blue); }
        
        @keyframes warn-flicker {
            0%, 100% { background: rgba(255, 255, 255, 0.05); }
            50% { background: rgba(255, 255, 255, 0.25); }
        }
        @keyframes beam-fire-h { 0% { transform: scaleY(0.1); opacity: 1; } 20% { transform: scaleY(1.2); opacity: 1; } 100% { transform: scaleY(0.8); opacity: 0; } }
        @keyframes beam-fire-v { 0% { transform: scaleX(0.1); opacity: 1; } 20% { transform: scaleX(1.2); opacity: 1; } 100% { transform: scaleX(0.8); opacity: 0; } }

        .blaster-warn { position: absolute; z-index: 1; animation: warn-flicker 0.1s infinite; border: 1px dashed rgba(255,255,255,0.4); }
        .blaster-beam { position: absolute; background: white; z-index: 8; box-shadow: 0 0 20px white; pointer-events: none; }
        .beam-anim-h { animation: beam-fire-h 0.45s forwards; transform-origin: center; }
        .beam-anim-v { animation: beam-fire-v 0.45s forwards; transform-origin: center; }
        
        #player-stats { width: 300px; display: flex; align-items: center; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        #hp-bar-container { width: 100px; height: 18px; background: var(--ui-red); margin: 0 10px; }
        #hp-bar-fill { width: 100%; height: 100%; background: var(--ui-yellow); transition: width 0.2s; }

        #menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 310px; }
        .menu-btn { border: 2px solid var(--ui-orange); color: var(--ui-orange); background: black; padding: 12px; font-size: 18px; font-weight: bold; text-align: center; cursor: pointer; text-transform: uppercase; }
        .menu-btn:active { background: #331a08; color: white; border-color: white; }

        .item-list { display: none; padding: 10px; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; box-sizing: border-box; }
        .item-option { color: white; cursor: pointer; padding: 8px; font-size: 14px; }
        .item-option::before { content: "* "; }

        #attack-game { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        #attack-bar-bg { width: 90%; height: 40px; border: 3px solid white; position: relative; }
        #attack-cursor { position: absolute; width: 8px; height: 100%; background: cyan; left: 0; box-shadow: 0 0 10px cyan; pointer-events: none; }
        #center-line { position: absolute; width: 4px; height: 100%; background: white; left: 50%; transform: translateX(-50%); pointer-events: none; }

        .full-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .restart-btn { margin-top: 20px; padding: 12px 24px; border: 2px solid white; background: black; color: white; font-family: inherit; font-size: 18px; cursor: pointer; text-transform: uppercase; pointer-events: auto; }

        #main-menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .diff-btn { background: black; border: 2px solid; padding: 15px 30px; margin: 10px; font-size: 18px; font-family: inherit; cursor: pointer; text-transform: uppercase; width: 280px; font-weight: bold; transition: all 0.1s; }
        .diff-btn.easy { border-color: var(--ui-green); color: var(--ui-green); }
        .diff-btn.normal { border-color: var(--ui-yellow); color: var(--ui-yellow); }
        .diff-btn.hard { border-color: var(--ui-red); color: var(--ui-red); }

        /* Animation Intro Styles */
        #intro-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 300; text-align: center; padding: 20px; box-sizing: border-box; }
        .intro-text { font-size: 18px; margin-bottom: 20px; color: white; min-height: 60px; max-width: 400px; }
        #intro-anim-container { width: 200px; height: 150px; border: 3px solid white; position: relative; margin-bottom: 30px; overflow: hidden; background: #000; }
        #intro-soul { 
            position: absolute; width: 16px; height: 16px; background: var(--ui-red);
            clip-path: path('M8 2.1c1.1-1.1 2.9-1.1 4 0 1.1 1.1 1.1 2.9 0 4L8 10.2 4 6.1c-1.1-1.1-1.1-2.9 0-4 1.1-1.1 2.9-1.1 4 0z');
            left: 92px; top: 67px;
        }
        .intro-skip-btn { position: absolute; bottom: 30px; border: 1px solid #666; color: #666; background: transparent; padding: 8px 16px; font-family: inherit; cursor: pointer; }

        #controls { position: fixed; bottom: 15px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 20; }
        .touch-zone { width: 110px; height: 110px; background: rgba(255,255,255,0.05); border-radius: 50%; pointer-events: auto; position: relative; border: 1px solid rgba(255,255,255,0.15); }
        #joystick-knob { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; top: 35px; left: 35px; }
        #jump-btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; color: white; }

        #flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; pointer-events: none; opacity: 0; z-index: 100; transition: opacity 0.05s; }

        /* Phases Visuals */
        .SKELETON.phase-2 #right-eye { fill: var(--ui-blue); filter: drop-shadow(0 0 5px var(--ui-blue)); }
        .SKELETON.phase-3 #right-eye { fill: var(--ui-red); filter: drop-shadow(0 0 8px var(--ui-red)); }
        .SKELETON.phase-4 #right-eye { fill: var(--ui-purple); filter: drop-shadow(0 0 10px var(--ui-purple)); animation: warn-flicker 0.2s infinite; }
        .SKELETON.phase-4 #enemy-sprite { animation: float-shake 0.2s infinite; }
        
        .KNIGHT.phase-2 #knight-eye { fill: var(--ui-orange); filter: drop-shadow(0 0 8px var(--ui-orange)); }
        .KNIGHT.phase-3 #knight-eye { fill: var(--ui-red); filter: drop-shadow(0 0 12px var(--ui-red)); animation: warn-flicker 0.2s infinite;}

        @keyframes float-shake { 0% {transform: translate(2px, 1px)} 50% {transform: translate(-2px, -1px)} 100% {transform: translate(2px, 1px)} }

        .top-btn { position: absolute; top: 15px; background: black; color: white; border: 2px solid white; padding: 8px 12px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; z-index: 400; display: none; }
        #back-to-menu-btn { left: 15px; }
        #mute-btn { right: 15px; border-color: var(--ui-cyan); color: var(--ui-cyan); }
    </style>
</head>
<body>

<div id="main-menu-overlay">
    <div style="color: white; font-size: 32px; font-weight: bold; margin-bottom: 10px; text-align: center; letter-spacing: 2px;">CHOOSE YOUR<br>OPPONENT</div>
    <div style="color: #666; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px;">CREATED BY NEWBIE</div>
    <button class="diff-btn easy" onclick="showIntro('DUMMY')">THE DUMMY (EASY)</button>
    <button class="diff-btn normal" onclick="showIntro('SKELETON')">THE SKELETON (NORMAL)</button>
    <button class="diff-btn hard" onclick="showIntro('KNIGHT')">THE KNIGHT (HARD MODE)</button>
</div>

<div id="intro-overlay">
    <div class="intro-text" id="intro-msg">Welcome, Human.</div>
    <div id="intro-anim-container">
        <div id="intro-soul"></div>
        <!-- Dynamic tutorial elements go here -->
    </div>
    <button class="intro-skip-btn" onclick="startGameDirectly()">SKIP TUTORIAL</button>
</div>

<button id="back-to-menu-btn" class="top-btn" onclick="goBackToMenu()">&lt; BACK</button>
<button id="mute-btn" class="top-btn" onclick="toggleMute()">🎵 MUTE</button>

<div id="game-screen">
    <div id="enemy-container">
        <div id="enemy-sprite"></div>
        <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
    </div>

    <div id="battle-area">
        <div id="dialogue-text">* The final battle begins.</div>
        <div id="item-menu" class="item-list"></div>
        <div id="act-menu" class="item-list"></div>

        <div id="attack-game">
            <div style="margin-bottom: 10px; color: cyan;">TAP TO ATTACK!</div>
            <div id="attack-bar-bg">
                <div id="center-line"></div>
                <div id="attack-cursor"></div>
            </div>
        </div>

        <div id="game-over-overlay" class="full-overlay">
            <div style="color: var(--ui-red); font-size: 24px; font-weight: bold;">GAME OVER</div>
            <button class="restart-btn" id="btn-gameover">MAIN MENU</button>
        </div>

        <div id="victory-overlay" class="full-overlay">
            <div style="color: var(--ui-yellow); font-size: 24px; font-weight: bold;">VICTORY</div>
            <div style="font-size: 14px; margin-top: 10px;">YOU WON!</div>
            <button class="restart-btn" id="btn-victory">MAIN MENU</button>
        </div>

        <div id="soul"></div>
    </div>

    <div id="player-stats">
        <span>LV 19</span><div id="hp-bar-container"><div id="hp-bar-fill"></div></div><span id="hp-text">92/92</span>
    </div>

    <div id="menu-grid">
        <div class="menu-btn" onclick="handleMenu('FIGHT')">FIGHT</div>
        <div class="menu-btn" onclick="handleMenu('ACT')">ACT</div>
        <div class="menu-btn" onclick="handleMenu('ITEM')">ITEM</div>
        <div class="menu-btn" onclick="handleMenu('MERCY')">MERCY</div>
    </div>
</div>

<div id="controls" style="display: none;">
    <div id="joystick" class="touch-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn" class="touch-zone" style="visibility: hidden; display: flex;">JUMP</div>
</div>

<div id="flash"></div>

<script>
    let state = 'MAIN_MENU';
    let currentCharacter = 'SKELETON';
    let hp = 92;
    let maxHp = 92;
    let enemyHp = 300;
    let maxEnemyHp = 300;
    let dmgMult = 1;
    let isBlueSoul = false;
    let soulPos = { x: 142, y: 140 };
    let velocity = { x: 0, y: 0 };
    let inputDir = { x: 0, y: 0 };
    
    let turnCount = 0;
    let projectiles = [];
    let invul = 0;
    let gameOver = false;
    let gameWon = false;
    let currentPhase = 1;
    let introTimer = null;

    const inventory = [];

    const soul = document.getElementById('soul');
    const battleArea = document.getElementById('battle-area');
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    const jumpBtn = document.getElementById('jump-btn');
    const controls = document.getElementById('controls');
    const itemMenu = document.getElementById('item-menu');
    const diagText = document.getElementById('dialogue-text');
    const attackGame = document.getElementById('attack-game');
    const attackCursor = document.getElementById('attack-cursor');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const victoryOverlay = document.getElementById('victory-overlay');
    const enemyHpFill = document.getElementById('enemy-hp-fill');
    const enemySprite = document.getElementById('enemy-sprite');
    const mainMenuOverlay = document.getElementById('main-menu-overlay');
    const backToMenuBtn = document.getElementById('back-to-menu-btn');
    const muteBtn = document.getElementById('mute-btn');
    const introOverlay = document.getElementById('intro-overlay');
    const introSoul = document.getElementById('intro-soul');
    const introMsg = document.getElementById('intro-msg');
    const introAnimContainer = document.getElementById('intro-anim-container');

    let audioCtx;
    let isMuted = false;
    let musicTimer;
    
    const NOTES = {
        'E2': 82.41, 'F2': 87.31, 'G2': 98.00, 'A2': 110.00, 'B2': 123.47,
        'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
        'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'A5': 880.00, 'G#4': 415.3, 'D#4': 311.1
    };

    const MUSIC_THEMES = {
        'DUMMY': { tempo: 130, type: 'square', seq: ['A3','C4','D4','D#4','E4','C4','A3','G3'], bass: ['A2','E3'] },
        'SKELETON': { tempo: 110, type: 'square', seq: ['D4','D4','D5','A4','G#4','G4','F4','D4'], bass: ['D3','C3','B2','A#2'] },
        'KNIGHT': { tempo: 100, type: 'sawtooth', seq: ['A4','E5','D5','C5','B4','C5','B4','G4'], bass: ['A2','F2','G2','E2'] }
    };

    function toggleMute() {
        isMuted = !isMuted;
        muteBtn.innerText = isMuted ? "🎵 UNMUTE" : "🎵 MUTE";
        if (isMuted && audioCtx) audioCtx.suspend(); 
        else if (!isMuted && audioCtx) audioCtx.resume();
    }

    function playMusic(character) {
        if (musicTimer) clearTimeout(musicTimer);
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const theme = MUSIC_THEMES[character];
        let seqIndex = 0;
        const playNextNote = () => {
            if (gameOver || gameWon || state === 'INTRO' || state === 'MAIN_MENU') return;
            let speedMod = (currentPhase - 1) * 0.1;
            if (!isMuted && audioCtx.state === 'running') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = theme.type;
                osc.frequency.value = NOTES[theme.seq[seqIndex % theme.seq.length]] || 440;
                osc.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
            seqIndex++;
            musicTimer = setTimeout(playNextNote, theme.tempo * (1 - speedMod));
        };
        playNextNote();
    }

    function playSoundEffect(type) {
        if (isMuted || !audioCtx || audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'hurt') { osc.type = 'sawtooth'; osc.frequency.value = 100; gain.gain.value = 0.1; }
        else { osc.type = 'sine'; osc.frequency.value = 400; gain.gain.value = 0.05; }
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    const CHARACTER_SVGS = {
        'DUMMY': `<svg viewBox="0 0 100 100" width="80" height="100"><ellipse cx="50" cy="50" rx="30" ry="40" fill="#d2b48c"/><circle cx="35" cy="40" r="4" fill="#5c4033"/><circle cx="65" cy="40" r="4" fill="#5c4033"/><path d="M35 60 Q50 70 65 60" fill="none" stroke="#5c4033" stroke-width="3"/></svg>`,
        'SKELETON': `<svg viewBox="0 0 100 100" width="80" height="100"><circle cx="50" cy="30" r="25" fill="white"/><path d="M35 55 L65 55 L70 95 L30 95 Z" fill="white"/><circle cx="40" cy="25" r="5" fill="black"/><circle id="right-eye" cx="60" cy="25" r="5" fill="black"/><path d="M40 42 Q50 48 60 42" fill="none" stroke="black" stroke-width="2"/></svg>`,
        'KNIGHT': `<svg viewBox="0 0 100 100" width="80" height="100"><path d="M20 30 L80 30 L65 90 L35 90 Z" fill="#c0c0c0" stroke="#808080" stroke-width="3"/><circle id="knight-eye" cx="50" cy="50" r="4" fill="var(--ui-cyan)"/></svg>`
    };

    function showIntro(character) {
        currentCharacter = character;
        mainMenuOverlay.style.display = 'none';
        introOverlay.style.display = 'flex';
        backToMenuBtn.style.display = 'block';
        state = 'INTRO';
        
        let step = 0;
        const messages = [
            "This is your SOUL. The very culmination of your being!",
            "Use the joystick to dodge the WHITE projectiles.",
            "Stay still for BLUE ones, and MOVE for ORANGE ones!",
            "If your SOUL is BLUE, you must JUMP to survive gravity.",
            "Stay determined... The battle is about to begin!"
        ];

        const nextStep = () => {
            if (state !== 'INTRO') return;
            introMsg.innerText = messages[step];
            
            const temp = introAnimContainer.querySelectorAll('.temp-anim');
            temp.forEach(t => t.remove());

            if (step === 1) {
                introSoul.animate([{left: '20px'}, {left: '160px'}, {left: '92px'}], {duration: 2000, iterations: Infinity});
            } else if (step === 2) {
                introSoul.style.animation = 'none';
                const b = document.createElement('div'); b.className = 'bone blue temp-anim'; b.style.cssText = 'position:absolute; width:10px; height:150px; left:0; top:0;';
                const o = document.createElement('div'); o.className = 'bone orange temp-anim'; o.style.cssText = 'position:absolute; width:10px; height:150px; left:190px; top:0;';
                introAnimContainer.appendChild(b); introAnimContainer.appendChild(o);
                b.animate([{left: '0px'}, {left: '200px'}], {duration: 3000, iterations: Infinity});
                o.animate([{left: '200px'}, {left: '0px'}], {duration: 3000, iterations: Infinity});
            } else if (step === 3) {
                introSoul.style.background = 'var(--ui-blue)';
                introSoul.animate([{top: '130px'}, {top: '60px'}, {top: '130px'}], {duration: 1000, iterations: Infinity});
            } else {
                introSoul.style.background = 'var(--ui-red)';
                introSoul.style.animation = 'none';
            }

            step++;
            if (step < messages.length) {
                introTimer = setTimeout(nextStep, 3500);
            } else {
                introTimer = setTimeout(startGameDirectly, 3500);
            }
        };
        nextStep();
    }

    function goBackToMenu() {
        clearTimeout(introTimer);
        if (musicTimer) clearTimeout(musicTimer);
        state = 'MAIN_MENU';
        mainMenuOverlay.style.display = 'flex';
        introOverlay.style.display = 'none';
        backToMenuBtn.style.display = 'none';
        muteBtn.style.display = 'none';
        controls.style.display = 'none';
        soul.style.display = 'none';
        gameOverOverlay.style.display = 'none';
        victoryOverlay.style.display = 'none';
        attackGame.style.display = 'none';
        battleArea.classList.remove('shrunk');
        projectiles.forEach(p => p.el.remove());
        projectiles = [];
        
        const introAnims = introAnimContainer.querySelectorAll('.temp-anim');
        introAnims.forEach(a => a.remove());
    }

    function startGameDirectly() {
        clearTimeout(introTimer);
        introOverlay.style.display = 'none';
        startGame(currentCharacter);
    }

    function startGame(character) {
        currentCharacter = character;
        document.getElementById('game-screen').className = character;
        currentPhase = 1;
        if (character === 'DUMMY') { maxHp = 99; enemyHp = 150; maxEnemyHp = 150; }
        else if (character === 'SKELETON') { maxHp = 92; enemyHp = 300; maxEnemyHp = 300; }
        else { maxHp = 50; enemyHp = 600; maxEnemyHp = 600; dmgMult = 1.8; }
        hp = maxHp;
        enemyHpFill.style.width = '100%';
        enemySprite.innerHTML = CHARACTER_SVGS[character];
        backToMenuBtn.style.display = 'block';
        muteBtn.style.display = 'block';
        state = 'MENU';
        updateHPDisplay();
        playMusic(character);
        initInventory();
        diagText.innerHTML = "* The battle begins.";
    }

    function initInventory() {
        inventory.length = 0;
        inventory.push({ name: 'Pie', hp: 99 }, { name: 'Steak', hp: 99 }, { name: 'Hero', hp: 99 });
    }

    const allPatterns = {
        'DUMMY': [{ minPhase: 1, maxPhase: 3, fn: (t) => {
            if (t % 40 === 0) spawnProjectile('bone', 310, Math.random() * 160, 15, 20, -4, 0);
        }}],
        'SKELETON': [
            { minPhase: 1, maxPhase: 4, fn: (t, p) => {
                setSoulMode(false);
                if (t % Math.max(10, 30 - p*5) === 0) {
                    spawnProjectile('bone', 310, Math.random() * 180, 15, 25, -6 - p, 0);
                }
            }},
            { minPhase: 2, maxPhase: 4, fn: (t, p) => {
                setSoulMode(true);
                if (t % 40 === 0) spawnProjectile('bone', 310, 160, 15, 40, -7, 0);
                if (t % 100 === 0) spawnBlaster('h', 80);
            }}
        ],
        'KNIGHT': [{ minPhase: 1, maxPhase: 3, fn: (t, p) => {
            if (t % 15 === 0) {
                let side = Math.random() > 0.5 ? -30 : 310;
                spawnProjectile('bone', side, soulPos.y, 30, 12, side < 0 ? 10 : -10, 0);
            }
        }}]
    };

    function spawnProjectile(type, x, y, w, h, vx, vy) {
        const el = document.createElement('div');
        el.className = type;
        el.style.width = w + 'px'; el.style.height = h + 'px';
        battleArea.appendChild(el);
        projectiles.push({ el, x, y, vx, vy, w, h, type });
    }

    function spawnBlaster(orient, pos) {
        const warn = document.createElement('div');
        warn.className = 'blaster-warn';
        if (orient === 'h') { warn.style.width = '300px'; warn.style.height = '20px'; warn.style.top = pos + 'px'; }
        else { warn.style.width = '20px'; warn.style.height = '200px'; warn.style.left = pos + 'px'; }
        battleArea.appendChild(warn);
        setTimeout(() => {
            if (state === 'MAIN_MENU') { warn.remove(); return; }
            warn.remove();
            const beam = document.createElement('div');
            beam.className = 'blaster-beam ' + (orient === 'h' ? 'beam-anim-h' : 'beam-anim-v');
            beam.style.width = warn.style.width; beam.style.height = warn.style.height;
            beam.style.top = warn.style.top; beam.style.left = warn.style.left;
            battleArea.appendChild(beam);
            const p = { el: beam, x: parseInt(beam.style.left || 0), y: parseInt(beam.style.top || 0), w: parseInt(beam.style.width), h: parseInt(beam.style.height), type: 'beam' };
            projectiles.push(p);
            setTimeout(() => { beam.remove(); projectiles = projectiles.filter(i => i !== p); }, 400);
        }, 600);
    }

    function handleMenu(type) {
        if (state !== 'MENU') return;
        playSoundEffect('select');
        if (type === 'FIGHT') startAttackMiniGame();
        else if (type === 'ITEM') { renderInventory(); itemMenu.style.display = 'grid'; state = 'SUBMENU'; diagText.style.display='none'; }
    }

    function startAttackMiniGame() {
        state = 'ATTACKING';
        diagText.style.display = 'none';
        attackGame.style.display = 'flex';
        let cursorX = 0; let speed = 7; let dir = 1;
        const anim = () => {
            if (state !== 'ATTACKING') return;
            cursorX += speed * dir;
            if (cursorX > 98 || cursorX < 0) dir *= -1;
            attackCursor.style.left = cursorX + '%';
            requestAnimationFrame(anim);
        };
        anim();
        attackGame.onclick = () => {
            state = 'WAITING'; attackGame.style.display = 'none';
            const acc = 1 - (Math.abs(cursorX - 50) / 50);
            const dmg = Math.floor(50 * acc) + 10;
            enemyHp -= dmg;
            enemyHpFill.style.width = (enemyHp/maxEnemyHp)*100 + '%';
            
            if (currentCharacter === 'SKELETON' && enemyHp < 100) {
                currentPhase = 4;
                battleArea.classList.add('shrunk');
                document.getElementById('game-screen').classList.add('phase-4');
            } else if (enemyHp < 200) {
                currentPhase = 2;
                document.getElementById('game-screen').classList.add('phase-2');
            }

            if (enemyHp <= 0) triggerVictory();
            else { diagText.style.display = 'block'; diagText.innerHTML = `* Dealt ${dmg} damage!`; setTimeout(startDodge, 1000); }
        };
    }

    function renderInventory() {
        itemMenu.innerHTML = '';
        inventory.forEach((item, i) => {
            const d = document.createElement('div'); d.className = 'item-option'; d.innerText = item.name;
            d.onclick = () => { hp = maxHp; inventory.splice(i, 1); updateHPDisplay(); itemMenu.style.display = 'none'; startAttackMiniGame(); };
            itemMenu.appendChild(d);
        });
    }

    function startDodge() {
        state = 'DODGING'; soul.style.display = 'block'; controls.style.display = 'flex';
        diagText.style.display = 'none';
        soulPos = { x: 140, y: 140 };
        let t = 0;
        let p = allPatterns[currentCharacter][Math.floor(Math.random() * allPatterns[currentCharacter].length)];
        const loop = () => {
            if (state !== 'DODGING') return;
            t++;
            if (isBlueSoul) {
                velocity.y += 0.5; soulPos.y += velocity.y; soulPos.x += inputDir.x * 5;
                if (soulPos.y > (battleArea.classList.contains('shrunk') ? 160 : 180)) { soulPos.y = (battleArea.classList.contains('shrunk') ? 160 : 180); velocity.y = 0; }
            } else {
                soulPos.x += inputDir.x * 5; soulPos.y += inputDir.y * 5;
            }
            const limit = battleArea.classList.contains('shrunk') ? 164 : 284;
            const hLimit = battleArea.classList.contains('shrunk') ? 164 : 184;
            soulPos.x = Math.max(0, Math.min(limit, soulPos.x));
            soulPos.y = Math.max(0, Math.min(hLimit, soulPos.y));
            soul.style.left = soulPos.x + 'px'; soul.style.top = soulPos.y + 'px';
            
            p.fn(t, currentPhase);
            checkCollisions();
            if (t < 350) requestAnimationFrame(loop); else endTurn();
        };
        loop();
    }

    function checkCollisions() {
        const sx = soulPos.x + 8; const sy = soulPos.y + 8;
        projectiles.forEach(p => {
            if (p.type !== 'beam') { p.x += p.vx; p.y += p.vy; p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px'; }
            if (invul <= 0 && sx > p.x && sx < p.x + p.w && sy > p.y && sy < p.y + p.h) {
                hp -= 5; invul = 30; playSoundEffect('hurt'); updateHPDisplay();
                if (hp <= 0) triggerGameOver();
            }
        });
        if (invul > 0) { invul--; soul.style.opacity = invul % 4 < 2 ? 0.2 : 1; } else soul.style.opacity = 1;
    }

    function endTurn() {
        state = 'MENU'; soul.style.display = 'none'; controls.style.display = 'none';
        diagText.style.display = 'block'; diagText.innerHTML = "* The enemy is breathing heavily.";
        projectiles.forEach(p => p.el.remove()); projectiles = [];
    }

    function triggerGameOver() { state = 'GAMEOVER'; gameOverOverlay.style.display = 'flex'; }
    function triggerVictory() { gameWon = true; victoryOverlay.style.display = 'flex'; }

    function updateHPDisplay() {
        document.getElementById('hp-bar-fill').style.width = (hp/maxHp)*100 + '%';
        document.getElementById('hp-text').innerText = hp + "/" + maxHp;
    }

    const handleInput = (e) => {
        if (state !== 'DODGING') return;
        const t = e.touches[0]; const r = joystick.getBoundingClientRect();
        const dx = t.clientX - (r.left + r.width/2); const dy = t.clientY - (r.top + r.height/2);
        const d = Math.min(Math.sqrt(dx*dx+dy*dy), 40); const a = Math.atan2(dy, dx);
        inputDir = { x: Math.cos(a) * (d/40), y: Math.sin(a) * (d/40) };
        knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
    };
    joystick.ontouchstart = joystick.ontouchmove = handleInput;
    joystick.ontouchend = () => { inputDir = {x:0,y:0}; knob.style.transform = 'none'; };
    jumpBtn.ontouchstart = () => { if (isBlueSoul && velocity.y === 0) velocity.y = -8; };

    function setSoulMode(b) { isBlueSoul = b; soul.className = b ? 'blue-mode' : ''; jumpBtn.style.visibility = b ? 'visible' : 'hidden'; }

    document.getElementById('btn-gameover').onclick = goBackToMenu;
    document.getElementById('btn-victory').onclick = goBackToMenu;
</script>
</body>
</html>
